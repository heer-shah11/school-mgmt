<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>School Management System - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a237e 0%, #283593 50%, #1565c0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        /* ── Main login card ── */
        .card {
            background: white;
            border-radius: 20px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        /* ── Logo / header area ── */
        .logo-area {
            text-align: center;
            margin-bottom: 1.8rem;
        }

        .logo-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #1a237e, #1565c0);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 0.8rem;
        }

        .logo-icon svg {
            width: 36px;
            height: 36px;
            fill: white;
        }

        .school-name {
            font-size: 20px;
            font-weight: 700;
            color: #1a237e;
        }

        .school-sub {
            font-size: 13px;
            color: #888;
            margin-top: 4px;
        }

        /* ── Role selector buttons ── */
        .role-label {
            font-size: 13px;
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
            display: block;
        }

        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        .role-btn {
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 12px 8px;
            background: white;
            cursor: pointer;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .role-btn svg {
            width: 28px;
            height: 28px;
        }

        .role-btn span {
            font-size: 14px;
            font-weight: 600;
            color: #555;
        }

        /* Active state = selected role */
        .role-btn.active {
            border-color: #1a237e;
            background: #e8eaf6;
        }

        .role-btn.active span {
            color: #1a237e;
        }

        /* ── Form fields ── */
        .field-label {
            font-size: 13px;
            font-weight: 600;
            color: #555;
            margin-bottom: 6px;
            display: block;
        }

        .input-field {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            color: #333;
            outline: none;
            background: #fafafa;
            margin-bottom: 1rem;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: #1a237e;
            background: white;
        }

        /* ── Login button ── */
        .login-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #1a237e, #1565c0);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.5px;
            margin-top: 4px;
            transition: opacity 0.2s, transform 0.1s;
        }

        .login-btn:hover  { opacity: 0.92; }
        .login-btn:active { transform: scale(0.98); }

        /* ── Forgot password link ── */
        .forgot-link {
            text-align: center;
            margin-top: 14px;
            font-size: 13px;
            color: #1565c0;
            cursor: pointer;
            text-decoration: underline;
        }

        /* ── Divider ── */
        .divider {
            border: none;
            border-top: 1px solid #f0f0f0;
            margin: 1.5rem 0;
        }

        .footer-note {
            text-align: center;
            font-size: 12px;
            color: #aaa;
        }

        /* ── Success / error messages ── */
        .success-msg {
            display: none;                       /* hidden by default */
            background: #e8f5e9;
            border: 1.5px solid #4caf50;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 13px;
            color: #2e7d32;
            font-weight: 600;
            text-align: center;
            margin-bottom: 1rem;
        }

        .error-msg {
            display: none;                       /* hidden by default */
            background: #ffebee;
            border: 1.5px solid #e57373;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
            color: #c62828;
            text-align: center;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>

<div class="card">

    <!-- ── Logo ── -->
    <div class="logo-area">
        <div class="logo-icon">
            <svg viewBox="0 0 24 24">
                <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/>
            </svg>
        </div>
        <div class="school-name">School Management System</div>
        <div class="school-sub">Welcome back! Please login to continue.</div>
    </div>

    <!-- ── Role selector ── -->
    <span class="role-label">Select your role:</span>
    <div class="role-selector">

        <!-- Teacher button -->
        <button class="role-btn active" id="btn-teacher" onclick="selectRole('teacher')">
            <svg viewBox="0 0 24 24" fill="#1a237e">
                <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12zM7 9h2v2H7zm4 0h2v2h-2zm4 0h2v2h-2z"/>
            </svg>
            <span>Teacher</span>
        </button>

        <!-- Student button -->
        <button class="role-btn" id="btn-student" onclick="selectRole('student')">
            <svg viewBox="0 0 24 24" fill="#888">
                <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
            </svg>
            <span>Student</span>
        </button>

    </div>

    <!-- ── Messages ── -->
    <div id="success-msg" class="success-msg">Login successful! Welcome!</div>
    <div id="error-msg"   class="error-msg">Invalid credentials. Please try again.</div>

    <!-- ── Form fields ── -->
    <label class="field-label" id="id-label" for="user-id">Teacher ID</label>
    <input class="input-field" type="text"     id="user-id"  placeholder="Enter your Teacher ID" />

    <label class="field-label" for="password">Password</label>
    <input class="input-field" type="password" id="password" placeholder="Enter your password" />

    <!-- ── Login button ── -->
    <button class="login-btn" onclick="handleLogin()">LOGIN</button>

    <!-- ── Forgot password ── -->
    <div class="forgot-link"
         onclick="alert('Please contact your administrator to reset your password.')">
        Forgot Password?
    </div>

    <hr class="divider" />
    <div class="footer-note">Academic Year 2025-26 &nbsp;|&nbsp; Powered by SMS Portal</div>

</div><!-- end .card -->


<script>

    // Tracks which role is currently selected
    var currentRole = 'teacher';

    // ── Called when user clicks Teacher or Student button ──
    function selectRole(role) {
        currentRole = role;

        // Toggle the .active class on both buttons
        document.getElementById('btn-teacher').classList.toggle('active', role === 'teacher');
        document.getElementById('btn-student').classList.toggle('active', role === 'student');

        // Change icon colors
        document.querySelector('#btn-teacher svg').setAttribute('fill', role === 'teacher' ? '#1a237e' : '#888');
        document.querySelector('#btn-student svg').setAttribute('fill', role === 'student' ? '#1a237e' : '#888');

        // Update label and placeholder text
        var label = document.getElementById('id-label');
        var input = document.getElementById('user-id');
        if (role === 'teacher') {
            label.textContent      = 'Teacher ID';
            input.placeholder      = 'Enter your Teacher ID';
        } else {
            label.textContent      = 'Student Roll No.';
            input.placeholder      = 'Enter your Roll Number';
        }

        hideMessages();   // clear any old messages
    }

    // ── Called when user clicks LOGIN ──
    function handleLogin() {
        var userId   = document.getElementById('user-id').value.trim();
        var password = document.getElementById('password').value.trim();

        hideMessages();

        // Check if fields are empty
        if (!userId || !password) {
            showError('Please enter both ID and password.');
            return;
        }

        // ── Demo credentials (change these or connect to a DB later) ──
        var validTeacher = (userId === 'teacher01' && password === 'teacher123');
        var validStudent = (userId === 'student01' && password === 'student123');

        if ((currentRole === 'teacher' && validTeacher) ||
            (currentRole === 'student' && validStudent)) {

            showSuccess('Login successful! Welcome, ' + (currentRole === 'teacher' ? 'Teacher' : 'Student') + '!');
            setTimeout(function(){
            window.location.href = "dashboard.html";
        }, 1000);

        } else {
            showError('Invalid credentials. Please try again.');
        }
    }

    // ── Helper functions ──
    function showSuccess(msg) {
        var el = document.getElementById('success-msg');
        el.textContent  = msg;
        el.style.display = 'block';
    }

    function showError(msg) {
        var el = document.getElementById('error-msg');
        el.textContent  = msg;
        el.style.display = 'block';
    }

    function hideMessages() {
        document.getElementById('success-msg').style.display = 'none';
        document.getElementById('error-msg').style.display   = 'none';
    }

</script>

</body>
</html>
