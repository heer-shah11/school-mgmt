<!DOCTYPE html>

<html>
<head>
    <title>Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            display: flex;
        }

        /* SIDEBAR */
        .sidebar {
            width: 220px;
            background: #1d976c;
            color: white;
            height: 100vh;
            padding: 20px;
        }

        .sidebar h2 {
            margin-bottom: 20px;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            margin: 10px 0;
        }

        .sidebar a:hover {
            text-decoration: underline;
        }

        /* MAIN */
        .main {
            flex: 1;
            padding: 20px;
            background: #f4f4f4;
        }

        /* TOP BAR */
        .topbar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        /* CARDS */
        .cards {
            display: flex;
            gap: 20px;
        }

        .card {
            flex: 1;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card h3 {
            margin: 0;
            color: #1d976c;
        }

    </style>

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">
    <h2>SMS</h2>
    <a href="#">Dashboard</a>
    <a href="#">Students</a>
    <a href="#">Attendance</a>
    <a href="#">Subjects</a>
</div>

<!-- MAIN CONTENT -->

<div class="main">

    <div class="topbar">
        <h1>Dashboard</h1>
        <p>Welcome User</p>
    </div>

    <div class="cards">
        <div class="card">
            <h3>50</h3>
            <p>Total Students</p>
        </div>

        ```
        <div class="card">
            <h3>40</h3>
            <p>Present Today</p>
        </div>

        <div class="card">
            <h3>10</h3>
            <p>Absent Today</p>
        </div>
        ```

    </div>

</div>

</body>
</html>
